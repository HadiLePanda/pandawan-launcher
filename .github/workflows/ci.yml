name: CI

on:
  push:
    branches: [main, dev, 'release/*']
  pull_request:
    branches: [main, dev, 'release/*']

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Version parity
        run: npm run version:check

      - name: Type check and build
        run: npm run build

      # The dashboard is a second Vite app with its own tsconfig, which the root
      # `tsc` does not include (include: ["src"]). Without this step a type error
      # or a build break in it ships unnoticed.
      - name: Type check and build (dashboard)
        run: npm run dashboard:build

      - name: Test
        run: npm test

      # The Dependency Policy says production hits are real and the count stays 0.
      # Without this step nothing enforces it and a new production CVE reaches a
      # tagged release unnoticed. --omit=dev so an advisory in a build-time package
      # cannot fail the build on its own.
      - name: Audit (production)
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # bundle_contents_tests.rs refuses to pass on CI when dist/ is absent, since
      # it would then inspect nothing. The rust-windows job builds the frontend
      # for that reason; this job must too. working-directory is the repo root,
      # not this job's src-tauri default.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build the frontend
        run: npm run build
        working-directory: ${{ github.workspace }}

      - name: Test
        run: cargo test --all-targets

      # cargo test in the root package selects the root package only, so the
      # export-bindings member - the documented way src/lib/bindings.ts is
      # regenerated - was never compiled and could rot behind a green build.
      - name: Check export-bindings
        run: cargo check -p export-bindings

      # `#[cfg(unix)]` blocks are skipped entirely by a Windows build, so a
      # mistake in one can sit in a green CI run for as long as nobody tags a
      # release. This type-checks the Unix path on every push, and needs no
      # linker because `cargo check` does not link.
      - name: Check the unix code path
        run: cargo check --target x86_64-unknown-linux-gnu --all-targets

  # The launcher ships to Windows first, so the reverse gap matters just as much:
  # `#[cfg(windows)]` and plain-Windows behaviour (path joining, cmd.exe, the
  # installer's own layout) are only ever exercised by the Linux job above when a
  # Windows dev runs it locally. This is the job that catches those.
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # bundle_contents_tests.rs returns early when dist/ is absent, so with no
      # frontend build on this runner the one check that no developer files ship
      # into a bundle inspects nothing at all. working-directory is the repo root,
      # not this job's src-tauri default.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build the frontend
        run: npm run build
        working-directory: ${{ github.workspace }}

      # Each integration suite is named explicitly rather than using
      # cargo test --tests, because that flag also builds and runs the lib
      # unittests. The lib test binary imports `TaskDialogIndirect`, which only
      # comctl32 **v6** exports; System32 ships v5, so on an image without the
      # v6 controls it dies with STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) before
      # a single assertion runs, and the job fails having verified nothing.
      # Naming each suite keeps the run honest about what actually executed.
      #
      # This is NOT a WebView2 problem, despite webview2-com-sys appearing in
      # the link line. The WebView2 loader is linked statically
      # (WebView2LoaderStatic.lib) and never appears in the binary's import
      # table, so it cannot be the missing entrypoint. Verified by dumping the
      # imports of the failing binary directly.
      #
      # These are the suites that exercise #[cfg(windows)] path joining and
      # layout, which the Linux job above cannot reach.
      - name: Test (bundle contents)
        run: cargo test --test bundle_contents_tests

      - name: Test (download)
        run: cargo test --test download_integration_tests

      - name: Test (patch)
        run: cargo test --test patch_integration_tests

      - name: Test (types)
        run: cargo test --test types_integration_tests

      - name: Test (updater signing)
        run: cargo test --test updater_signing_tests

      - name: Test (workflow)
        run: cargo test --test workflow_integration_tests

      # The lib unit tests belong in this job, but cannot run until the binary
      # declares the comctl32 v6 dependency (an embedded SxS manifest, not a
      # WebView2 runtime). continue-on-error means a missing runtime does not
      # fail the job, while the separate step keeps a real assertion failure
      # inside them reported rather than hidden behind a loader error.
      - name: Test (lib unit tests, needs comctl32 v6)
        continue-on-error: true
        run: cargo test --lib

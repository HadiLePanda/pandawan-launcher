name: CI

on:
  push:
    branches: [main, dev, 'release/*']
  pull_request:
    branches: [main, dev, 'release/*']

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check and build
        run: npm run build

      - name: Test
        run: npm test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # `#[cfg(unix)]` blocks are skipped entirely by a Windows build, so a
      # mistake in one can sit in a green CI run for as long as nobody tags a
      # release. This type-checks the Unix path on every push, and needs no
      # linker because `cargo check` does not link.
      - name: Check the unix code path
        run: cargo check --target x86_64-unknown-linux-gnu --all-targets

  # The launcher ships to Windows first, so the reverse gap matters just as much:
  # `#[cfg(windows)]` and plain-Windows behaviour (path joining, cmd.exe, the
  # installer's own layout) are only ever exercised by the Linux job above when a
  # Windows dev runs it locally. This is the job that catches those.
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Each integration suite is named explicitly rather than using
      # cargo test --tests, because that flag also builds and runs the lib
      # unittests - and the lib test binary links webview2-com-sys, resolving
      # the WebView2 loader at load time. On an image without the runtime it
      # dies with STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) before a single
      # assertion runs, so the job fails having verified nothing. Naming each
      # suite keeps the run honest about what actually executed.
      #
      # These are the suites that exercise #[cfg(windows)] path joining and
      # layout, which the Linux job above cannot reach.
      - name: Test (bundle contents)
        run: cargo test --test bundle_contents_tests

      - name: Test (download)
        run: cargo test --test download_integration_tests

      - name: Test (patch)
        run: cargo test --test patch_integration_tests

      - name: Test (types)
        run: cargo test --test types_integration_tests

      - name: Test (updater signing)
        run: cargo test --test updater_signing_tests

      - name: Test (workflow)
        run: cargo test --test workflow_integration_tests

      # The lib unit tests still belong in this job, but they cannot run without
      # the WebView2 runtime present. continue-on-error keeps a missing runtime
      # from failing the job, while the separate step means a real assertion
      # failure inside them is still reported rather than hidden.
      - name: Test (lib unit tests, needs WebView2 runtime)
        continue-on-error: true
        run: cargo test --lib

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Manual trigger for re-running only the R2 publish step against an existing
  # release. The bundles are already built and signed at that point, so this
  # takes ~30 seconds instead of the ~25 minutes a full three-platform build
  # takes. Use it to test or repair publishing without re-cutting a tag.
  #
  #   gh workflow run release.yml -f publish_only=true -f tag=v0.1.0
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Only re-publish to R2 from an existing release (skip building)'
        type: boolean
        default: false
      tag:
        description: 'Existing tag to re-publish from (required when publish_only is true)'
        type: string
        required: false

jobs:
  check-versions:
    name: Check version consistency
    # Skipped for a publish-only rerun: nothing is rebuilt, so the working tree's
    # version numbers are irrelevant.
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify versions match
        shell: bash
        run: |
          NODE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*= *\"\(.*\)\".*/\1/')
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "package.json:  $NODE_VERSION"
          echo "Cargo.toml:    $CARGO_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"

          if [[ "$NODE_VERSION" != "$CARGO_VERSION" || "$NODE_VERSION" != "$TAURI_VERSION" ]]; then
            echo "Version mismatch. Bump all three files to the same value."
            exit 1
          fi

      - name: Verify updater public key is present
        shell: bash
        run: |
          if [[ ! -f src-tauri/updater.pub ]]; then
            echo "Missing src-tauri/updater.pub. Generate a minisign key pair and commit the public key."
            exit 1
          fi

      - name: Verify signing secret is configured
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Without this secret `tauri build` produces no .sig files and no
          # latest.json, and the release silently ships with nothing for the
          # updater to verify. Fail loudly instead.
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::GitHub secret TAURI_SIGNING_PRIVATE_KEY is not set."
            echo "Set it to the verbatim contents of src-tauri/.secrets/updater.key:"
            echo "  gh secret set TAURI_SIGNING_PRIVATE_KEY < src-tauri/.secrets/updater.key"
            exit 1
          fi
          # The CLI base64-decodes the value, so it must not be raw minisign text.
          if [[ "$SIGNING_KEY" == "untrusted comment:"* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY looks like raw minisign text."
            echo "It must be the base64 form written by 'tauri signer generate'."
            exit 1
          fi
          echo "Signing secret is configured."

  release:
    name: Release ${{ matrix.platform }}
    needs: check-versions
    # Skipped for a publish-only rerun: the bundles already exist on the release
    # and do not need rebuilding.
    if: ${{ !inputs.publish_only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          # One installer per platform, and the updater decides which one: Windows
          # ships NSIS only (the updater installs through it, so the .msi is a
          # second WiX pass for a format nothing here uses), and Linux the .deb.
          # The AppImage bundler downloads tools from GitHub that often hit 429
          # rate limits, so it stays out.
          - platform: ubuntu-latest
            args: '--bundles deb'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri bundle
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Verbatim contents of src-tauri/.secrets/updater.key. `tauri signer
          # generate` writes that file base64-encoded and the CLI base64-decodes
          # it, so it must not be re-encoded or replaced with raw minisign text.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Only needed when the key was generated with a password. Without it the
          # CLI prompts interactively and this build hangs until it times out.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pandawan Launcher ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install Pandawan Launcher.'
          # Draft: this release is a build record only. The updater reads
          # latest.json from R2 (see the publish-updater job), so nothing here
          # needs to be publicly downloadable.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  # Mirror the signed bundles and the updater manifest to the R2 bucket that
  # the launcher's updater endpoint points at. The GitHub release above is
  # private, so its asset URLs are not readable by players: the URLs inside
  # latest.json are rewritten to the public bucket before upload.
  publish-updater:
    name: Publish updater assets to R2
    # Normally gated on a successful build; on a publish-only rerun the release
    # job is skipped, so the gate has to be relaxed or nothing would ever run.
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || inputs.publish_only) }}
    runs-on: ubuntu-latest
    environment: production
    # This token defaults to read-only, and a read-only token cannot see a draft
    # release - which is the only kind of release this workflow creates, and the
    # only kind this job downloads from. Reading drafts needs push access.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # On a tag push this is already the tag; on a manual publish-only run
          # ref_name is the branch, so the input tag is used instead.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download signed bundles from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p bundles

          # `gh release download <tag>` does not see draft releases, and this
          # workflow deliberately publishes drafts, so the assets are fetched
          # through the API instead. The release id is looked up by tag for the
          # same reason: there is no way to resolve it by name.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" \
            | head -1)

          if [ -z "$RELEASE_ID" ]; then
            echo "No release found for tag $RELEASE_TAG."
            exit 1
          fi

          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --paginate --jq '.[].name' | while read -r name; do
              case "$name" in
                *.msi|*.msi.sig|*.app.tar.gz|*.app.tar.gz.sig|*.dmg|*.deb|*.deb.sig|*.rpm|*.rpm.sig|*.exe|*.exe.sig|latest.json) ;;
                *) continue ;;
              esac
              id=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
                --paginate --jq ".[] | select(.name == \"$name\") | .id" | head -1)
              gh api -H "Accept: application/octet-stream" \
                "repos/${{ github.repository }}/releases/assets/$id" > "bundles/$name"
              echo "  fetched $name"
            done
          # Build the asset-id -> filename map that the rewrite step needs for the
          # macOS targets. `--paginate` emits one JSON array per page, so the pages
          # are concatenated before mapping; `jq -s` slurps them into a single
          # array. Written into bundles/ because that is where the rewrite step
          # looks for it.
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --paginate | jq -s 'add | [.[] | {id, name}]' > bundles/assets-compact.json
          echo "asset map entries: $(jq 'length' bundles/assets-compact.json)"
          ls -la bundles

      - name: Point latest.json at the public bucket
        run: |
          set -euo pipefail
          # Reads the base URL from the committed updater endpoint in
          # tauri.conf.json, so the published manifest can never drift from
          # the endpoint the launcher actually polls.
          #
          # --assets is required: tauri-action emits macOS URLs that end in a
          # numeric release-asset id rather than a filename, so without the id
          # to filename mapping those targets would be rewritten to a bucket
          # URL that 404s for every macOS player.
          node scripts/rewrite-updater-urls.mjs \
            bundles/latest.json \
            --from-config src-tauri/tauri.conf.json \
            --assets bundles/assets-compact.json \
            bundles/latest.rewritten.json
          mv bundles/latest.rewritten.json bundles/latest.json
          cat bundles/latest.json

      - name: Upload bundles to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          # aws-cli 2.33.x computes a CRC32 checksum by default, and its recursive
          # `s3 cp` then aborts with
          #   "Need to rewind the stream <botocore.httpchecksum.AwsChunkedWrapper ...>,
          #    but stream is not seekable"
          # (aws-cli#10026, a regression). `when_required` restores the previous
          # behaviour. Upload integrity is still covered by the minisign signature
          # the launcher verifies before installing any bundle.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          set -euo pipefail
          # Immutable, long-lived caching for the versioned bundles: their names
          # include the version, so the bytes at a given URL never change.
          # --recursive is required: a directory source aborts with "Is a
          # directory" without it, and --exclude only applies to recursive runs.
          # assets-compact.json is the build's asset map, not a download.
          aws s3 cp bundles/ "s3://$R2_BUCKET/launcher/" \
            --recursive \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --no-progress \
            --exclude 'latest.json' \
            --exclude 'assets-compact.json' \
            --cache-control 'public, max-age=31536000, immutable'
          # latest.json is the one mutable file, and it must never be cached or
          # clients keep polling a stale version and miss new releases.
          aws s3 cp bundles/latest.json "s3://$R2_BUCKET/launcher/latest.json" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --no-progress \
            --cache-control 'no-cache, no-store, must-revalidate' \
            --content-type 'application/json'
          echo "Published to s3://$R2_BUCKET/launcher/"

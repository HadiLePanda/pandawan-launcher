name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  check-versions:
    name: Check version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify versions match
        shell: bash
        run: |
          NODE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*= *\"\(.*\)\".*/\1/')
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "package.json:  $NODE_VERSION"
          echo "Cargo.toml:    $CARGO_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"

          if [[ "$NODE_VERSION" != "$CARGO_VERSION" || "$NODE_VERSION" != "$TAURI_VERSION" ]]; then
            echo "Version mismatch. Bump all three files to the same value."
            exit 1
          fi

      - name: Verify updater public key is present
        shell: bash
        run: |
          if [[ ! -f src-tauri/updater.pub ]]; then
            echo "Missing src-tauri/updater.pub. Generate a minisign key pair and commit the public key."
            exit 1
          fi

  release:
    name: Release ${{ matrix.platform }}
    needs: check-versions
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          # AppImage bundler downloads tools from GitHub and often hits 429 rate limits,
          # so stick to the reliable .deb and .rpm packages for now.
          - platform: ubuntu-latest
            args: '--bundles deb,rpm'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri bundle
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pandawan Launcher ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install Pandawan Launcher.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

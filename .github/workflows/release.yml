name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  check-versions:
    name: Check version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify versions match
        shell: bash
        run: |
          NODE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*= *\"\(.*\)\".*/\1/')
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "package.json:  $NODE_VERSION"
          echo "Cargo.toml:    $CARGO_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"

          if [[ "$NODE_VERSION" != "$CARGO_VERSION" || "$NODE_VERSION" != "$TAURI_VERSION" ]]; then
            echo "Version mismatch. Bump all three files to the same value."
            exit 1
          fi

      - name: Verify updater public key is present
        shell: bash
        run: |
          if [[ ! -f src-tauri/updater.pub ]]; then
            echo "Missing src-tauri/updater.pub. Generate a minisign key pair and commit the public key."
            exit 1
          fi

  release:
    name: Release ${{ matrix.platform }}
    needs: check-versions
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          # AppImage bundler downloads tools from GitHub and often hits 429 rate limits,
          # so stick to the reliable .deb and .rpm packages for now.
          - platform: ubuntu-latest
            args: '--bundles deb,rpm'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri bundle
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pandawan Launcher ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install Pandawan Launcher.'
          # Draft: this release is a build record only. The updater reads
          # latest.json from R2 (see the publish-updater job), so nothing here
          # needs to be publicly downloadable.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  # Mirror the signed bundles and the updater manifest to the R2 bucket that
  # the launcher's updater endpoint points at. The GitHub release above is
  # private, so its asset URLs are not readable by players: the URLs inside
  # latest.json are rewritten to the public bucket before upload.
  publish-updater:
    name: Publish updater assets to R2
    needs: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download signed bundles from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p bundles
          gh release download "${{ github.ref_name }}" \
            --dir bundles \
            --pattern '*.msi' --pattern '*.msi.sig' \
            --pattern '*.app.tar.gz' --pattern '*.app.tar.gz.sig' \
            --pattern '*.deb' --pattern '*.deb.sig' \
            --pattern 'latest.json' \
            --clobber
          ls -la bundles

      - name: Point latest.json at the public bucket
        run: |
          set -euo pipefail
          # Reads the base URL from the committed updater endpoint in
          # tauri.conf.json, so the published manifest can never drift from
          # the endpoint the launcher actually polls.
          node scripts/rewrite-updater-urls.mjs \
            bundles/latest.json \
            --from-config src-tauri/tauri.conf.json \
            bundles/latest.rewritten.json
          mv bundles/latest.rewritten.json bundles/latest.json
          cat bundles/latest.json

      - name: Upload bundles to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          # Immutable, long-lived caching for the versioned bundles: their names
          # include the version, so the bytes at a given URL never change.
          aws s3 cp bundles/ "s3://$R2_BUCKET/launcher/" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --no-progress \
            --exclude 'latest.json' \
            --cache-control 'public, max-age=31536000, immutable'
          # latest.json is the one mutable file, and it must never be cached or
          # clients keep polling a stale version and miss new releases.
          aws s3 cp bundles/latest.json "s3://$R2_BUCKET/launcher/latest.json" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --no-progress \
            --cache-control 'no-cache, no-store, must-revalidate' \
            --content-type 'application/json'
          echo "Published to s3://$R2_BUCKET/launcher/"

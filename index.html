<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-circle-p.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pandawan Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="splash" role="status" aria-label="Loading">
      <style>
        #splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0e1013;
          font-family: 'Geist', system-ui, sans-serif;
          transition: opacity 0.3s ease;
        }
        .splash-mark {
          position: relative;
          width: 96px;
          height: 96px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .splash-ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 2px solid transparent;
          border-top-color: #f4f4f5;
          opacity: 0.6;
          animation: spin 1.2s linear infinite;
        }
        .splash-logo {
          width: 72px;
          height: 72px;
          border-radius: 16px;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: breathe 2.5s ease-in-out infinite;
        }
        .splash-logo img {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
        @keyframes breathe {
          0%,
          100% {
            transform: scale(1);
            opacity: 1;
          }
          50% {
            transform: scale(1.05);
            opacity: 0.75;
          }
        }
      </style>
      <div class="splash-mark">
        <div class="splash-ring"></div>
        <div class="splash-logo"><img src="/logo-circle-p.png" alt="Pandawan Launcher" /></div>
      </div>
    </div>

    <script>
      (function () {
        var splash = document.getElementById('splash');
        function hideSplash() {
          if (!splash) return;
          splash.style.opacity = '0';
          setTimeout(function () {
            splash.remove();
          }, 300);
        }
        window.hideSplash = hideSplash;
        setTimeout(hideSplash, 12000);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

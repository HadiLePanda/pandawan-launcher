<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="ringInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background -->

  <!-- Outer capsule ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ringOuter)" stroke-width="12" filter="url(#glow)"/>

  <!-- Inner tech ring with gap (capsule detail) -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#ringInner)" stroke-width="6" stroke-dasharray="1156 40" stroke-linecap="round"/>

  <!-- Stylized P centered at 256,256 -->
  <g transform="translate(256,256)">
    <!-- P stem -->
    <rect x="-68" y="-88" width="36" height="176" rx="8" fill="url(#letterGrad)"/>
    <!-- P bowl outer -->
    <path d="M -32 -88 L 28 -88 C 72 -88 104 -56 104 -16 C 104 24 72 56 28 56 L -32 56 L -32 24 L 24 24 C 46 24 66 8 66 -16 C 66 -40 46 -56 24 -56 L -32 -56 Z" fill="url(#letterGrad)"/>
  </g>

  <!-- Gold capsule dot -->
  <circle cx="368" cy="368" r="20" fill="#d4af37" filter="url(#glow)"/>
  <circle cx="368" cy="368" r="12" fill="#f3e5ab"/>
</svg>

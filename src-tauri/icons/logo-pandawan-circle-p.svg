<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="ringInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0e1013"/>

  <!-- Outer capsule ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ringOuter)" stroke-width="12" filter="url(#glow)"/>

  <!-- Inner tech ring with gap (capsule detail) -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#ringInner)" stroke-width="6" stroke-dasharray="1156 40" stroke-linecap="round"/>

  <!-- Stylized P -->
  <g transform="translate(256,256)">
    <!-- P stem -->
    <rect x="-52" y="-88" width="36" height="176" rx="8" fill="url(#letterGrad)"/>
    <!-- P bowl -->
    <path d="M -16 -88 L 48 -88 C 96 -88 128 -56 128 -16 C 128 24 96 56 48 56 L -16 56 L -16 20 L 44 20 C 68 20 88 4 88 -16 C 88 -36 68 -52 44 -52 L -16 -52 Z" fill="url(#letterGrad)"/>
    <!-- Negative space accent -->
    <circle cx="44" cy="-16" r="14" fill="#0e1013"/>
  </g>

  <!-- Gold capsule dot -->
  <circle cx="368" cy="368" r="20" fill="#d4af37" filter="url(#glow)"/>
  <circle cx="368" cy="368" r="12" fill="#f3e5ab"/>
</svg>

[package]
name = "pandawan-launcher"
version = "0.4.1"
description = "Pandawan Corp Game Launcher"
authors = ["Pandawan Corp"]
edition = "2021"
rust-version = "1.70"

# The dev tooling lives in its own package (export-bindings/) on purpose: the app
# crate must declare exactly one binary, because the macOS bundler copies every
# binary it finds and the universal build never produces the tool.
[workspace]
members = ["export-bindings"]

[lib]
name = "pandawan_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Opening a folder or URL in the system handler. shellexecute-on-windows routes Windows
# through ShellExecuteW rather than `cmd /c start`, which re-parses the path it is handed.
open = { version = "5", features = ["shellexecute-on-windows"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tempfile = "3.10"
walkdir = "2.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }
specta-typescript = "=0.0.12"
# Manifest and latest.json verification, in src/manifest_signature.rs.
minisign-verify = "0.2"
base64 = "0.22"

[dev-dependencies]
mockito = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

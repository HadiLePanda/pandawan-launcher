[package]
name = "pandawan-launcher"
version = "0.3.0"
description = "Pandawan Corp Game Launcher"
authors = ["Pandawan Corp"]
edition = "2021"
rust-version = "1.70"

# The dev tooling lives in its own package (export-bindings/) on purpose: the app
# crate must declare exactly one binary, because the macOS bundler copies every
# binary it finds and the universal build never produces the tool.
[workspace]
members = ["export-bindings"]

[lib]
name = "pandawan_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Opening a folder or URL in the system handler, from Rust. The
# shellexecute-on-windows feature is on so Windows goes through ShellExecuteW
# instead of `cmd /c start`, which re-parses the path it is handed: a folder named
# with a `%` in it would be expanded by cmd. tauri-plugin-shell depends on this
# crate too, so the feature unifies and the frontend's open() calls take the same
# route. `dunce` was already in the tree through tauri, so this adds no crate.
open = { version = "5", features = ["shellexecute-on-windows"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tempfile = "3.10"
walkdir = "2.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }
specta-typescript = "=0.0.12"
# Manifest and latest.json verification. These were dev-dependencies while only the
# signing tests used them; the launcher itself verifies now, so the parse and the
# signature check live in src/manifest_signature.rs.
minisign-verify = "0.2"
base64 = "0.22"

[dev-dependencies]
mockito = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
